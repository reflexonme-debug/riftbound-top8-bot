
name: Riftbound Top 8 - Suivi et mises a jour

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: riftbound-top8
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les bibliotheques
        run: python -m pip install requests beautifulsoup4

      - name: Chercher les Top 8 et actualiser Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DECKS_WEBHOOK_URL }}
        run: |
          cat > decks.py <<'PY'
          import os
          import re
          import json
          import time
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          ROOT = "https://riftwatch.gg"
          LIST_URL = ROOT + "/tournaments/"
          STATE_FILE = "top8_messages.json"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"].rstrip("/")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 RiftboundTop8Bot/5.0"
          })

          OFFICIAL = (
              "regional qualifier",
              "regional championship",
              "national championship",
              "world championship",
              "showdown",
          )

          def clean(value):
              return " ".join(str(value).split())

          def fetch(url):
              response = session.get(
                  url, timeout=30
              )
              response.raise_for_status()
              return BeautifulSoup(
                  response.text, "html.parser"
              )

          def valid_url(url, prefix):
              parsed = urlparse(url)
              return (
                  parsed.scheme == "https"
                  and parsed.netloc in (
                      "riftwatch.gg",
                      "www.riftwatch.gg"
                  )
                  and parsed.path.startswith(prefix)
              )

          def discover():
              soup = fetch(LIST_URL)
              events = {}

              for a in soup.select("a[href]"):
                  url = urljoin(ROOT, a["href"])
                  path = urlparse(url).path.rstrip("/")
                  title = clean(
                      a.get_text(" ", strip=True)
                  )

                  if not re.fullmatch(
                      r"/tournaments/[^/]+", path
                  ):
                      continue

                  if not valid_url(
                      url, "/tournaments/"
                  ):
                      continue

                  if not any(
                      term in title.lower()
                      for term in OFFICIAL
                  ):
                      continue

                  events[url] = title

              return list(events.items())

          def read_legend(deck_url):
              try:
                  soup = fetch(deck_url)

                  # Methode 1 :
                  # image de la Legend.
                  for img in soup.find_all("img"):
                      alt = clean(
                          img.get("alt", "")
                      )

                      match = re.match(
                          r"^(.+?)\s*\(Legend\)$",
                          alt,
                          flags=re.IGNORECASE
                      )

                      if match:
                          return match.group(1).strip()

                  # Methode 2 :
                  # section Legend and champion.
                  for heading in soup.find_all(
                      ["h2", "h3", "h4"]
                  ):
                      label = clean(
                          heading.get_text(
                              " ", strip=True
                          )
                      ).lower()

                      if "legend and champion" not in label:
                          continue

                      for item in heading.next_elements:
                          tag = getattr(
                              item, "name", None
                          )

                          if tag in ("h2", "h3", "h4"):
                              break

                          if tag != "li":
                              continue

                          link = item.find("a")
                          if not link:
                              continue

                          name = clean(
                              link.get_text(
                                  " ", strip=True
                              )
                          )

                          name = re.sub(
                              r"^Quantity\s*\d+\s*",
                              "",
                              name,
                              flags=re.IGNORECASE
                          )

                          name = re.sub(
                              r"\s+Champion.*$",
                              "",
                              name,
                              flags=re.IGNORECASE
                          )

                          if name:
                              return name[:100]

                  # Methode 3 :
                  # information en haut de page.
                  text = soup.get_text(
                      " ", strip=True
                  )

                  match = re.search(
                      r"([A-Za-zÀ-ÿ' -]+,\s*"
                      r"[A-Za-zÀ-ÿ' -]+)"
                      r"\s+(?:Calm|Chaos|Fury|"
                      r"Mind|Body|Order)",
                      text
                  )

                  if match:
                      return clean(
                          match.group(1)
                      )[-100:]

                  print(
                      "Legend introuvable :",
                      urlparse(deck_url).path
                  )

              except Exception as error:
                  print(
                      "Erreur Legend :",
                      urlparse(deck_url).path,
                      type(error).__name__
                  )

              return None

          def read_tournament(url, previous=None):
              soup = fetch(url)

              h1 = soup.find("h1")
              title = (
                  clean(h1.get_text(" ", strip=True))
                  if h1 else "Tournoi Riftbound"
              )

              rankings = {}

              # Recuperer les decks classes #1 a #8.
              for a in soup.select("a[href]"):
                  full = urljoin(
                      ROOT, a.get("href", "")
                  )

                  if not valid_url(full, "/decks/"):
                      continue

                  if not re.fullmatch(
                      r"/decks/[^/]+/?",
                      urlparse(full).path
                  ):
                      continue

                  label = clean(
                      a.get_text(" ", strip=True)
                  )

                  match = re.match(
                      r"^#\s*([1-8])\s+(.+)$",
                      label
                  )

                  if not match:
                      continue

                  rank = str(int(match.group(1)))
                  player = clean(match.group(2))

                  if rank not in rankings:
                      rankings[rank] = {
                          "player": player,
                          "url": full,
                          "legend": None
                      }

              old_rankings = (
                  (previous or {}).get(
                      "rankings", {}
                  )
              )

              for rank, entry in rankings.items():
                  old = old_rankings.get(
                      rank, {}
                  )

                  # Verifier la Legend a chaque
                  # passage. Si le site ne repond
                  # pas, conserver l'ancienne
                  # seulement pour le meme deck.
                  legend = read_legend(
                      entry["url"]
                  )

                  if legend:
                      entry["legend"] = legend
                  elif old.get("url") == entry["url"]:
                      entry["legend"] = old.get(
                          "legend"
                      )

              return title, rankings

          def build_embed(title, url, rankings):
              lines = []
              medals = {
                  1: "🥇",
                  2: "🥈",
                  3: "🥉"
              }

              for rank in range(1, 9):
                  entry = rankings.get(
                      str(rank)
                  )

                  symbol = medals.get(
                      rank, "🃏"
                  )

                  if entry:
                      lines.append(
                          f"{symbol} **{rank}. "
                          f"{entry['player']}**"
                      )

                      legend = (
                          entry.get("legend")
                          or "Non renseignée"
                      )

                      lines.append(
                          "🃏 **Legend : "
                          + legend + "**"
                      )

                      lines.append(
                          "🔗 [Voir le deck]"
                          f"({entry['url']})"
                      )

                  else:
                      lines.append(
                          f"**{rank}.** "
                          "Decklist non publiée"
                      )

                  lines.append("")

              lines.append(
                  "📋 [Résultats complets]"
                  f"({url})"
              )

              return {
                  "title": "🏆 " + title[:220],
                  "url": url,
                  "description": "\n".join(
                      lines
                  )[:4000],
                  "color": 15844367,
                  "footer": {
                      "text": (
                          "Top 8 Riftbound"
                          " | Source : Riftwatch"
                      )
                  }
              }

          def discord_request(method, url, payload):
              response = requests.request(
                  method,
                  url,
                  json=payload,
                  timeout=30
              )

              if response.status_code == 429:
                  delay = response.json().get(
                      "retry_after", 3
                  )
                  time.sleep(
                      min(float(delay) + 1, 30)
                  )

                  response = requests.request(
                      method,
                      url,
                      json=payload,
                      timeout=30
                  )

              return response

          def create_message(embed):
              response = discord_request(
                  "POST",
                  WEBHOOK + "?wait=true",
                  {
                      "username": "Riftbound Top 8",
                      "allowed_mentions": {
                          "parse": []
                      },
                      "embeds": [embed]
                  }
              )

              response.raise_for_status()
              time.sleep(1)

              return str(
                  response.json()["id"]
              )

          def edit_message(message_id, embed):
              response = discord_request(
                  "PATCH",
                  WEBHOOK + "/messages/"
                  + str(message_id),
                  {
                      "embeds": [embed],
                      "allowed_mentions": {
                          "parse": []
                      }
                  }
              )

              if response.status_code == 404:
                  return False

              response.raise_for_status()
              time.sleep(1)
              return True

          def load_state():
              if not os.path.exists(
                  STATE_FILE
              ):
                  return {}

              with open(
                  STATE_FILE,
                  encoding="utf-8"
              ) as file:
                  return json.load(file)

          def save_state(state):
              with open(
                  STATE_FILE, "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      state,
                      file,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )

          def main():
              state = load_state()
              events = discover()

              print(
                  "Tournois officiels detectes :",
                  len(events)
              )

              if not events:
                  raise RuntimeError(
                      "Aucun tournoi trouve "
                      "sur Riftwatch."
                  )

              created = 0
              updated = 0
              unchanged = 0
              errors = 0

              # Premier test : deux tournois.
              # Ensuite : cinq nouveaux
              # tournois maximum par passage.
              first_run = not state
              new_limit = (
                  2 if first_run else 5
              )

              # Controler d'abord les messages
              # Discord deja existants.
              events.sort(
                  key=lambda event:
                      event[0] not in state
              )

              for url, listing_title in events:
                  previous = state.get(url)

                  if (
                      previous is None
                      and created >= new_limit
                  ):
                      continue

                  try:
                      title, rankings = read_tournament(
                          url, previous
                      )

                      if not rankings:
                          print(
                              "Top 8 indisponible :",
                              title
                          )
                          continue

                      snapshot = {
                          "title": title,
                          "rankings": rankings
                      }

                      if previous:
                          old_snapshot = {
                              "title": previous.get(
                                  "title"
                              ),
                              "rankings": previous.get(
                                  "rankings", {}
                              )
                          }

                          if snapshot == old_snapshot:
                              unchanged += 1
                              print(
                                  "Aucun changement :",
                                  title
                              )
                              continue

                      embed = build_embed(
                          title, url, rankings
                      )

                      if (
                          previous
                          and previous.get(
                              "message_id"
                          )
                      ):
                          success = edit_message(
                              previous["message_id"],
                              embed
                          )

                          if success:
                              message_id = previous[
                                  "message_id"
                              ]
                              updated += 1
                              print(
                                  "Message Discord modifie :",
                                  title
                              )
                          else:
                              message_id = create_message(
                                  embed
                              )
                              created += 1
                              print(
                                  "Ancien message supprime, "
                                  "nouveau message cree :",
                                  title
                              )
                      else:
                          message_id = create_message(
                              embed
                          )
                          created += 1
                          print(
                              "Message Discord cree :",
                              title
                          )

                      state[url] = {
                          "message_id": message_id,
                          "title": title,
                          "rankings": rankings
                      }

                      save_state(state)

                  except Exception as error:
                      errors += 1
                      print(
                          "Erreur tournoi :",
                          url,
                          type(error).__name__,
                          str(error)[:120]
                      )

              print(
                  "Nouveaux messages :", created
              )
              print(
                  "Messages modifies :", updated
              )
              print(
                  "Sans changement :", unchanged
              )
              print(
                  "Erreurs :", errors
              )

              if errors:
                  raise RuntimeError(
                      "Certains tournois "
                      "n'ont pas ete traites."
                  )

          if __name__ == "__main__":
              main()
          PY

          python decks.py

      - name: Memoriser les messages Discord
        if: always()
        run: |
          if [ -f top8_messages.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add top8_messages.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualisation des Top 8 Discord"
              git push
            fi
          fi
