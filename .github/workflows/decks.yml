
name: Riftbound Top 8 - Depuis Radiance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: riftbound-top8
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les bibliotheques
        run: python -m pip install requests beautifulsoup4

      - name: Surveiller les Top 8
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DECKS_WEBHOOK_URL }}
        run: |
          cat > decks.py <<'PY'
          import os
          import re
          import json
          import time
          import requests

          from datetime import date
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup

          ROOT = "https://riftwatch.gg"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"].rstrip("/")
          STATE_FILE = "top8_messages.json"

          # Sortie officielle de Radiance.
          START_DATE = date(2026, 10, 23)

          OFFICIAL = (
              "regional qualifier",
              "regional championship",
              "national championship",
              "world championship",
              "showdown"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 RiftboundTop8Bot/8.0"
          })

          def clean(value):
              return " ".join(str(value).split())

          def fetch(url):
              response = session.get(url, timeout=30)
              response.raise_for_status()
              return BeautifulSoup(
                  response.text, "html.parser"
              )

          def path_is(url, section):
              parsed = urlparse(url)
              return (
                  parsed.scheme == "https"
                  and parsed.netloc in (
                      "riftwatch.gg",
                      "www.riftwatch.gg"
                  )
                  and re.fullmatch(
                      r"/" + section + r"/[^/]+/?",
                      parsed.path
                  ) is not None
              )

          def tournament_date(url):
              path = urlparse(url).path
              match = re.search(
                  r"(\d{4}-\d{2}-\d{2})/?$",
                  path
              )

              if not match:
                  return None

              try:
                  return date.fromisoformat(
                      match.group(1)
                  )
              except ValueError:
                  return None

          def discover():
              soup = fetch(ROOT + "/tournaments/")
              events = {}

              for link in soup.find_all(
                  "a", href=True
              ):
                  url = urljoin(
                      ROOT, link["href"]
                  )

                  if not path_is(
                      url, "tournaments"
                  ):
                      continue

                  event_day = tournament_date(url)

                  # Date absente ou anterieure
                  # a Radiance : ne pas publier.
                  if (
                      event_day is None
                      or event_day < START_DATE
                  ):
                      continue

                  title = clean(
                      link.get_text(" ", strip=True)
                  )

                  if not any(
                      term in title.lower()
                      for term in OFFICIAL
                  ):
                      continue

                  events[url] = title

              return sorted(
                  events.items(),
                  key=lambda item: (
                      tournament_date(item[0]),
                      item[0]
                  ),
                  reverse=True
              )

          def read_legend(deck_url):
              soup = fetch(deck_url)

              # 1. Carte marquee Legend
              # dans la section du deck.
              for heading in soup.find_all(
                  ["h2", "h3", "h4"]
              ):
                  heading_text = clean(
                      heading.get_text(
                          " ", strip=True
                      )
                  ).lower()

                  if (
                      "legend and champion"
                      not in heading_text
                  ):
                      continue

                  for item in heading.next_elements:
                      tag = getattr(
                          item, "name", None
                      )

                      if tag in (
                          "h2", "h3", "h4"
                      ):
                          break

                      if tag != "li":
                          continue

                      item_text = clean(
                          item.get_text(
                              " ", strip=True
                          )
                      )

                      if not re.search(
                          r"\bLegend\b",
                          item_text,
                          re.IGNORECASE
                      ):
                          continue

                      link = item.find("a")

                      if not link:
                          continue

                      name = clean(
                          link.get_text(
                              " ", strip=True
                          )
                      )

                      name = re.sub(
                          r"^Quantity\s*\d+\s*",
                          "",
                          name,
                          flags=re.IGNORECASE
                      )

                      if name:
                          return name[:100]

              # 2. Image dont le texte
              # alternatif precise Legend.
              for image in soup.find_all("img"):
                  alt = clean(
                      image.get("alt", "")
                  )

                  match = re.match(
                      r"^(.+?)\s*\(Legend\)$",
                      alt,
                      re.IGNORECASE
                  )

                  if match:
                      return match.group(1).strip()

              return None

          def read_tournament(url, previous):
              soup = fetch(url)
              heading = soup.find("h1")

              title = (
                  clean(
                      heading.get_text(
                          " ", strip=True
                      )
                  )
                  if heading
                  else "Tournoi Riftbound"
              ).strip(" /")

              rankings = {}

              old_rankings = (
                  (previous or {}).get(
                      "rankings"
                  ) or {}
              )

              for link in soup.find_all(
                  "a", href=True
              ):
                  deck_url = urljoin(
                      ROOT, link["href"]
                  )

                  if not path_is(
                      deck_url, "decks"
                  ):
                      continue

                  label = clean(
                      link.get_text(
                          " ", strip=True
                      )
                  )

                  match = re.match(
                      r"^#\s*([1-8])\s+(.+)$",
                      label
                  )

                  if not match:
                      continue

                  rank = str(
                      int(match.group(1))
                  )

                  if rank in rankings:
                      continue

                  player = clean(
                      match.group(2)
                  )

                  old = (
                      old_rankings.get(rank)
                      or {}
                  )

                  try:
                      legend = read_legend(
                          deck_url
                      )
                  except Exception as error:
                      print(
                          "Lecture Legend echouee :",
                          urlparse(deck_url).path,
                          type(error).__name__
                      )
                      legend = None

                  # Garder l'ancienne Legend
                  # uniquement si la decklist
                  # est restee identique.
                  if (
                      not legend
                      and old.get("url") == deck_url
                  ):
                      legend = old.get(
                          "legend"
                      )

                  rankings[rank] = {
                      "player": player,
                      "url": deck_url,
                      "legend": legend
                  }

                  print(
                      player,
                      "- Legend :",
                      legend or "Non renseignee"
                  )

              return title, rankings

          def make_embed(title, url, rankings):
              lines = []
              medals = {
                  1: "🥇",
                  2: "🥈",
                  3: "🥉"
              }

              for rank in range(1, 9):
                  entry = rankings.get(
                      str(rank)
                  )

                  if not entry:
                      lines.append(
                          f"**{rank}.** "
                          "Decklist non disponible"
                      )
                      lines.append("")
                      continue

                  symbol = medals.get(
                      rank, "🃏"
                  )

                  legend = (
                      entry.get("legend")
                      or "Non renseignée"
                  )

                  lines.extend([
                      f"{symbol} **{rank}. "
                      f"{entry['player']}**",
                      f"🃏 **Legend : {legend}**",
                      "🔗 [Voir le deck]"
                      f"({entry['url']})",
                      ""
                  ])

              lines.append(
                  "📋 [Résultats complets]"
                  f"({url})"
              )

              event_day = tournament_date(
                  url
              )

              return {
                  "title": "🏆 " + title[:220],
                  "url": url,
                  "description": (
                      "\n".join(lines)[:4000]
                  ),
                  "color": 15844367,
                  "footer": {
                      "text": (
                          "Riftbound Top 8"
                          " | Source : Riftwatch"
                          " | Depuis Radiance"
                      )
                  }
              }

          def discord(method, path, payload):
              for attempt in range(3):
                  response = requests.request(
                      method,
                      WEBHOOK + path,
                      json=payload,
                      timeout=30
                  )

                  if response.status_code != 429:
                      return response

                  delay = response.json().get(
                      "retry_after", 3
                  )

                  time.sleep(
                      min(float(delay) + 1, 30)
                  )

              raise RuntimeError(
                  "Limite Discord atteinte"
              )

          def create_message(embed):
              response = discord(
                  "POST",
                  "?wait=true",
                  {
                      "username": "Riftbound Top 8",
                      "embeds": [embed],
                      "allowed_mentions": {
                          "parse": []
                      }
                  }
              )

              response.raise_for_status()
              time.sleep(1)

              return str(
                  response.json()["id"]
              )

          def update_message(message_id, embed):
              response = discord(
                  "PATCH",
                  "/messages/" + str(message_id),
                  {
                      "embeds": [embed],
                      "allowed_mentions": {
                          "parse": []
                      }
                  }
              )

              if response.status_code == 404:
                  return False

              response.raise_for_status()
              time.sleep(1)
              return True

          def load_state():
              if not os.path.exists(
                  STATE_FILE
              ):
                  return {}

              with open(
                  STATE_FILE,
                  encoding="utf-8"
              ) as file:
                  return json.load(file)

          def save_state(state):
              with open(
                  STATE_FILE, "w",
                  encoding="utf-8"
              ) as file:
                  json.dump(
                      state,
                      file,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )

          def main():
              state = load_state()
              events = discover()

              print(
                  "Tournois depuis Radiance :",
                  len(events)
              )

              if not events:
                  print(
                      "Aucun nouveau tournoi "
                      "admissible trouve."
                  )
                  return

              created = 0
              updated = 0
              unchanged = 0
              errors = 0

              # Verifier en priorite les
              # tournois deja publies.
              events.sort(
                  key=lambda item:
                      item[0] not in state
              )

              for url, _ in events:
                  previous = state.get(url)

                  try:
                      title, rankings = read_tournament(
                          url, previous
                      )

                      if not rankings:
                          print(
                              "Pas de decklist :",
                              title
                          )
                          continue

                      snapshot = {
                          "title": title,
                          "rankings": rankings
                      }

                      if previous:
                          old_snapshot = {
                              "title": previous.get(
                                  "title"
                              ),
                              "rankings": previous.get(
                                  "rankings", {}
                              )
                          }

                          if snapshot == old_snapshot:
                              unchanged += 1
                              continue

                      embed = make_embed(
                          title, url, rankings
                      )

                      if (
                          previous
                          and previous.get(
                              "message_id"
                          )
                      ):
                          message_id = str(
                              previous["message_id"]
                          )

                          if update_message(
                              message_id, embed
                          ):
                              updated += 1
                              print(
                                  "Mis a jour :",
                                  title
                              )
                          else:
                              message_id = create_message(
                                  embed
                              )
                              created += 1
                              print(
                                  "Message recree :",
                                  title
                              )

                      else:
                          message_id = create_message(
                              embed
                          )
                          created += 1
                          print(
                              "Nouveau tournoi :",
                              title
                          )

                      state[url] = {
                          "message_id": message_id,
                          "title": title,
                          "rankings": rankings
                      }

                      save_state(state)

                  except Exception as error:
                      errors += 1
                      print(
                          "Erreur tournoi :",
                          url,
                          type(error).__name__
                      )

              print(
                  "Nouveaux messages :",
                  created
              )
              print(
                  "Messages modifies :",
                  updated
              )
              print(
                  "Sans changement :",
                  unchanged
              )
              print(
                  "Erreurs :",
                  errors
              )

              if errors:
                  raise RuntimeError(
                      "Certains tournois ont echoue"
                  )

          if __name__ == "__main__":
              main()
          PY

          python decks.py

      - name: Sauvegarder la memoire Discord
        if: always()
        run: |
          if [ -f top8_messages.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add top8_messages.json
            if ! git diff --cached --quiet; then
              git commit -m "Maj des Top 8 depuis Radiance"
              git push
            fi
          fi
