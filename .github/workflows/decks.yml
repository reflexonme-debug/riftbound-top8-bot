
name: Riftbound Top 8 - Depuis Radiance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: riftbound-top8
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install requests beautifulsoup4

      - name: Actualiser les Top 8 Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DECKS_WEBHOOK_URL }}
        run: |
          cat > decks.py <<'PY'
          import os
          import re
          import json
          import time
          from datetime import date
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          ROOT = "https://riftwatch.gg"
          STATE_FILE = "top8_messages.json"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"].rstrip("/")
          START_DATE = date(2026, 10, 23)

          OFFICIAL = (
              "regional qualifier",
              "regional championship",
              "national championship",
              "world championship",
              "showdown"
          )

          http = requests.Session()
          http.headers["User-Agent"] = (
              "Mozilla/5.0 RiftboundTop8/9.0"
          )

          def clean(value):
              return " ".join(str(value or "").split())

          def fetch(url):
              response = http.get(url, timeout=30)
              response.raise_for_status()
              return BeautifulSoup(
                  response.text, "html.parser"
              )

          def valid_url(url, section):
              p = urlparse(url)
              return (
                  p.scheme == "https"
                  and p.netloc in (
                      "riftwatch.gg",
                      "www.riftwatch.gg"
                  )
                  and re.fullmatch(
                      r"/" + section + r"/[^/]+/?",
                      p.path
                  ) is not None
              )

          def tournament_date(url):
              match = re.search(
                  r"(\d{4}-\d{2}-\d{2})/?$",
                  urlparse(url).path
              )
              if not match:
                  return None

              try:
                  return date.fromisoformat(
                      match.group(1)
                  )
              except ValueError:
                  return None

          def discover():
              soup = fetch(ROOT + "/tournaments/")
              events = {}

              for a in soup.select("a[href]"):
                  url = urljoin(ROOT, a["href"])
                  if not valid_url(url, "tournaments"):
                      continue

                  day = tournament_date(url)
                  if day is None or day < START_DATE:
                      continue

                  title = clean(
                      a.get_text(" ", strip=True)
                  )

                  if not any(
                      word in title.lower()
                      for word in OFFICIAL
                  ):
                      continue

                  events[url] = title

              return sorted(
                  events.items(),
                  key=lambda e: (
                      tournament_date(e[0]), e[0]
                  ),
                  reverse=True
              )

          def extract_rank(text):
              match = re.search(
                  r"^\s*0?([1-8])(?:\D|$)",
                  text
              )
              return (
                  str(int(match.group(1)))
                  if match else None
              )

          def read_table(soup):
              rankings = {}

              # Le tableau contient :
              # Place | Player | Legend |
              # Record | Decklist.
              for table in soup.find_all("table"):
                  rows = table.find_all("tr")

                  if not rows:
                      continue

                  headers = [
                      clean(c.get_text(
                          " ", strip=True
                      )).lower()
                      for c in rows[0].find_all(
                          ["th", "td"]
                      )
                  ]

                  required = (
                      "place", "player", "legend"
                  )
                  if not all(
                      field in headers
                      for field in required
                  ):
                      continue

                  rank_col = headers.index("place")
                  player_col = headers.index("player")
                  legend_col = headers.index("legend")
                  deck_col = (
                      headers.index("decklist")
                      if "decklist" in headers
                      else None
                  )

                  for row in rows[1:]:
                      cells = row.find_all(
                          ["td", "th"],
                          recursive=False
                      )
                      needed = max(
                          rank_col,
                          player_col,
                          legend_col
                      )

                      if len(cells) <= needed:
                          continue

                      rank = extract_rank(
                          clean(cells[rank_col].get_text(
                              " ", strip=True
                          ))
                      )

                      if rank is None:
                          continue

                      player = clean(
                          cells[player_col].get_text(
                              " ", strip=True
                          )
                      )
                      legend = clean(
                          cells[legend_col].get_text(
                              " ", strip=True
                          )
                      )

                      # Utiliser le texte alternatif
                      # de la carte si necessaire.
                      if not legend:
                          img = cells[legend_col].find(
                              "img"
                          )
                          if img:
                              legend = clean(
                                  img.get("alt", "")
                              )

                      deck_url = None
                      search_in = (
                          cells[deck_col]
                          if (
                              deck_col is not None
                              and len(cells) > deck_col
                          )
                          else row
                      )

                      for a in search_in.select("a[href]"):
                          full = urljoin(
                              ROOT, a["href"]
                          )
                          if valid_url(full, "decks"):
                              deck_url = full
                              break

                      if player:
                          rankings[rank] = {
                              "player": player,
                              "legend": (
                                  legend or None
                              ),
                              "url": deck_url
                          }

                      if len(rankings) >= 8:
                          break

                  if rankings:
                      break

              return rankings

          def read_deck_legend(deck_url):
              soup = fetch(deck_url)

              for image in soup.find_all("img"):
                  alt = clean(image.get("alt", ""))
                  match = re.match(
                      r"^(.+?)\s*\(Legend\)$",
                      alt,
                      flags=re.IGNORECASE
                  )
                  if match:
                      return match.group(1).strip()

              for heading in soup.find_all(
                  ["h2", "h3", "h4"]
              ):
                  text = clean(
                      heading.get_text(
                          " ", strip=True
                      )
                  ).lower()

                  if "legend and champion" not in text:
                      continue

                  for item in heading.next_elements:
                      tag = getattr(item, "name", None)

                      if tag in ("h2", "h3", "h4"):
                          break

                      if tag != "li":
                          continue

                      item_text = clean(
                          item.get_text(
                              " ", strip=True
                          )
                      )
                      if not re.search(
                          r"\bLegend\b",
                          item_text,
                          re.IGNORECASE
                      ):
                          continue

                      link = item.find("a")
                      if link:
                          name = clean(
                              link.get_text(
                                  " ", strip=True
                              )
                          )
                          name = re.sub(
                              r"^Quantity\s*\d+\s*",
                              "",
                              name,
                              flags=re.IGNORECASE
                          )
                          if name:
                              return name[:100]

              return None

          def read_tournament(url, previous):
              soup = fetch(url)

              h1 = soup.find("h1")
              title = (
                  clean(h1.get_text(" ", strip=True))
                  if h1 else "Tournoi Riftbound"
              ).strip(" /")

              rankings = read_table(soup)

              # Secours si le tableau est absent :
              # lire les liens de deck classes.
              if not rankings:
                  for a in soup.select("a[href]"):
                      deck_url = urljoin(
                          ROOT, a["href"]
                      )
                      if not valid_url(
                          deck_url, "decks"
                      ):
                          continue

                      label = clean(
                          a.get_text(" ", strip=True)
                      )
                      match = re.match(
                          r"^#\s*([1-8])\s+(.+)$",
                          label
                      )
                      if not match:
                          continue

                      rank = str(int(match.group(1)))
                      rankings.setdefault(rank, {
                          "player": clean(
                              match.group(2)
                          ),
                          "legend": None,
                          "url": deck_url
                      })

              old_rankings = (
                  (previous or {}).get(
                      "rankings"
                  ) or {}
              )

              for rank, entry in rankings.items():
                  old = old_rankings.get(rank) or {}

                  if (
                      not entry["legend"]
                      and entry["url"]
                  ):
                      try:
                          entry["legend"] = (
                              read_deck_legend(
                                  entry["url"]
                              )
                          )
                      except Exception as exc:
                          print(
                              "Lecture Legend impossible :",
                              rank,
                              type(exc).__name__
                          )

                  if not entry["legend"]:
                      if (
                          old.get("player")
                          == entry["player"]
                          and old.get("url")
                          == entry["url"]
                      ):
                          entry["legend"] = old.get(
                              "legend"
                          )

                  print(
                      rank,
                      entry["player"],
                      "-",
                      entry["legend"]
                      or "Legend non renseignee",
                      "- deck :",
                      "oui" if entry["url"] else "non"
                  )

              return title, rankings

          def make_embed(title, url, rankings):
              lines = []
              medals = {
                  1: "🥇",
                  2: "🥈",
                  3: "🥉"
              }

              for rank in range(1, 9):
                  entry = rankings.get(str(rank))

                  if not entry:
                      lines.append(
                          f"**{rank}.** "
                          "Resultat non publie"
                      )
                      lines.append("")
                      continue

                  symbol = medals.get(rank, "🃏")
                  legend = (
                      entry.get("legend")
                      or "Non renseignee"
                  )

                  lines.append(
                      f"{symbol} **{rank}. "
                      f"{entry['player']}**"
                  )
                  lines.append(
                      "🃏 **Legend : "
                      + legend + "**"
                  )

                  if entry.get("url"):
                      lines.append(
                          "🔗 [Voir le deck]"
                          f"({entry['url']})"
                      )
                  else:
                      lines.append(
                          "🔗 Decklist non publiee"
                      )

                  lines.append("")

              lines.append(
                  "📋 [Resultats complets]"
                  f"({url})"
              )

              return {
                  "title": "🏆 " + title[:220],
                  "url": url,
                  "description": "\n".join(
                      lines
                  )[:4000],
                  "color": 15844367,
                  "footer": {
                      "text": (
                          "Riftbound Top 8"
                          " | Source : Riftwatch"
                          " | Depuis Radiance"
                      )
                  }
              }

          def discord(method, path, payload):
              for attempt in range(3):
                  response = requests.request(
                      method,
                      WEBHOOK + path,
                      json=payload,
                      timeout=30
                  )

                  if response.status_code != 429:
                      return response

                  delay = response.json().get(
                      "retry_after", 3
                  )
                  time.sleep(
                      min(float(delay) + 1, 30)
                  )

              raise RuntimeError(
                  "Limite de requetes Discord"
              )

          def create_message(embed):
              response = discord(
                  "POST", "?wait=true",
                  {
                      "username": "Riftbound Top 8",
                      "embeds": [embed],
                      "allowed_mentions": {
                          "parse": []
                      }
                  }
              )
              response.raise_for_status()
              return str(response.json()["id"])

          def edit_message(message_id, embed):
              response = discord(
                  "PATCH",
                  "/messages/" + str(message_id),
                  {
                      "embeds": [embed],
                      "allowed_mentions": {
                          "parse": []
                      }
                  }
              )

              if response.status_code == 404:
                  return False

              response.raise_for_status()
              return True

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {}

              with open(
                  STATE_FILE,
                  encoding="utf-8"
              ) as f:
                  content = f.read().strip()

              return (
                  json.loads(content)
                  if content else {}
              )

          def save_state(state):
              with open(
                  STATE_FILE, "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state, f,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True
                  )

          def main():
              state = load_state()
              events = discover()

              print(
                  "Tournois depuis Radiance :",
                  len(events)
              )

              if not events:
                  print("Aucun tournoi trouve")
                  return

              created = 0
              updated = 0
              unchanged = 0
              errors = 0

              # Verifier d'abord les tournois
              # ayant deja un message Discord.
              events.sort(
                  key=lambda x: x[0] not in state
              )

              for url, _ in events:
                  previous = state.get(url)

                  try:
                      title, rankings = read_tournament(
                          url, previous
                      )

                      if not rankings:
                          print(
                              "Classement absent :", title
                          )
                          continue

                      snapshot = {
                          "title": title,
                          "rankings": rankings
                      }

                      if previous:
                          old = {
                              "title": previous.get(
                                  "title"
                              ),
                              "rankings": previous.get(
                                  "rankings", {}
                              )
                          }

                          if snapshot == old:
                              unchanged += 1
                              continue

                      embed = make_embed(
                          title, url, rankings
                      )

                      if (
                          previous
                          and previous.get(
                              "message_id"
                          )
                      ):
                          message_id = str(
                              previous["message_id"]
                          )

                          if edit_message(
                              message_id, embed
                          ):
                              updated += 1
                              print(
                                  "Message modifie :",
                                  title
                              )
                          else:
                              message_id = create_message(
                                  embed
                              )
                              created += 1
                              print(
                                  "Message recree :",
                                  title
                              )
                      else:
                          message_id = create_message(
                              embed
                          )
                          created += 1
                          print(
                              "Nouveau tournoi :",
                              title
                          )

                      state[url] = {
                          "message_id": message_id,
                          "title": title,
                          "rankings": rankings
                      }
                      save_state(state)

                  except Exception as error:
                      errors += 1
                      print(
                          "Erreur tournoi :",
                          url,
                          type(error).__name__,
                          str(error)[:150]
                      )

              print("Nouveaux messages :", created)
              print("Messages modifies :", updated)
              print("Sans changement :", unchanged)
              print("Erreurs :", errors)

              if errors:
                  raise RuntimeError(
                      "Certains tournois ont echoue"
                  )

          if __name__ == "__main__":
              main()
          PY

          python decks.py

      - name: Sauvegarder les messages Discord
        if: always()
        run: |
          if [ -f top8_messages.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add top8_messages.json
            if ! git diff --cached --quiet; then
              git commit -m "Maj des classements Top 8"
              git push
            fi
          fi
