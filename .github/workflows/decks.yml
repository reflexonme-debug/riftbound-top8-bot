
name: Riftbound Top 8 Tournois

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: riftbound-top8
  cancel-in-progress: false

jobs:
  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les bibliotheques
        run: pip install requests beautifulsoup4

      - name: Chercher les Top 8 et envoyer Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DECKS_WEBHOOK_URL }}
        run: |
          cat > decks.py <<'PY'
          import os
          import re
          import json
          import time
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          import requests

          ROOT = "https://riftwatch.gg"
          LIST_URL = ROOT + "/tournaments/"
          STATE_FILE = "top8_seen.json"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 RiftboundTop8Bot/2.0"
          })

          OFFICIAL = (
              "regional qualifier",
              "showdown",
              "regional championship",
              "national championship",
              "world championship"
          )

          def fetch(url):
              response = session.get(url, timeout=30)
              response.raise_for_status()
              return BeautifulSoup(
                  response.text, "html.parser"
              )

          def normalize(text):
              return " ".join(str(text).split())

          def is_official(title):
              text = title.lower()
              return any(word in text for word in OFFICIAL)

          def discover():
              soup = fetch(LIST_URL)
              events = []
              seen = set()

              for a in soup.select("a[href]"):
                  href = a.get("href", "")
                  url = urljoin(ROOT, href)
                  path = urlparse(url).path.rstrip("/")
                  title = normalize(
                      a.get_text(" ", strip=True)
                  )

                  if not re.fullmatch(
                      r"/tournaments/[^/]+", path
                  ):
                      continue

                  if not is_official(title):
                      continue

                  if url in seen:
                      continue

                  seen.add(url)
                  events.append((title, url))

              return events

          def read_top8(url):
              soup = fetch(url)

              title_tag = soup.find("h1")
              title = (
                  normalize(
                      title_tag.get_text(" ", strip=True)
                  )
                  if title_tag else "Tournoi Riftbound"
              )

              rankings = {}

              for a in soup.select("a[href]"):
                  href = a.get("href", "")
                  full = urljoin(ROOT, href)

                  if not re.fullmatch(
                      r"/decks/[^/]+/?",
                      urlparse(full).path
                  ):
                      continue

                  label = normalize(
                      a.get_text(" ", strip=True)
                  )

                  match = re.match(
                      r"^#\s*([1-8])\s+(.+)$",
                      label
                  )

                  if not match:
                      continue

                  rank = int(match.group(1))
                  player = match.group(2).strip()

                  if rank not in rankings:
                      rankings[rank] = {
                          "player": player,
                          "url": full
                      }

              return title, rankings

          def send(title, url, rankings):
              lines = []

              medals = {
                  1: "🥇",
                  2: "🥈",
                  3: "🥉"
              }

              for rank in range(1, 9):
                  entry = rankings.get(rank)

                  if entry:
                      symbol = medals.get(rank, "🃏")
                      lines.append(
                          f"{symbol} **{rank}. "
                          f"{entry['player']}** — "
                          f"[Voir le deck]"
                          f"({entry['url']})"
                      )
                  else:
                      lines.append(
                          f"**{rank}.** Decklist "
                          "non disponible"
                      )

              payload = {
                  "username": "Riftbound Top 8",
                  "embeds": [{
                      "title": "🏆 " + title[:230],
                      "url": url,
                      "description": (
                          "\n".join(lines)
                          + "\n\n"
                          "📋 [Résultats complets]"
                          f"({url})"
                      )[:4000],
                      "color": 15844367,
                      "footer": {
                          "text": (
                              "Résultats : Riftwatch"
                              " | Tournois officiels"
                          )
                      }
                  }]
              }

              response = session.post(
                  WEBHOOK, json=payload,
                  timeout=30
              )
              response.raise_for_status()
              time.sleep(2)

          def main():
              if os.path.exists(STATE_FILE):
                  with open(
                      STATE_FILE, encoding="utf-8"
                  ) as f:
                      seen = set(json.load(f))
              else:
                  seen = set()

              events = discover()

              print(
                  "Tournois officiels detectes :",
                  len(events)
              )

              if not events:
                  raise RuntimeError(
                      "Aucun tournoi trouve sur Riftwatch. "
                      "Verifier la structure du site."
                  )

              sent = 0

              # Deux tournois maximum au premier test.
              limit = 2 if not seen else 5

              for listing_title, url in events:
                  if url in seen:
                      continue

                  try:
                      title, rankings = read_top8(url)

                      print(
                          title,
                          "- decklists Top 8 :",
                          len(rankings)
                      )

                      # Au moins une decklist du Top 8
                      # est necessaire pour publier.
                      if not rankings:
                          print(
                              "Ignore : aucune decklist",
                              url
                          )
                          continue

                      send(title, url, rankings)
                      seen.add(url)
                      sent += 1

                      print(
                          "Discord : tournoi envoye",
                          url
                      )

                      if sent >= limit:
                          break

                  except Exception as error:
                      print(
                          "Erreur tournoi :",
                          url, repr(error)
                      )

              with open(
                  STATE_FILE, "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      sorted(seen), f,
                      ensure_ascii=False, indent=2
                  )

              print(
                  "Nouveaux tournois envoyes :",
                  sent
              )

          if __name__ == "__main__":
              main()
          PY

          python decks.py

      - name: Memoriser les tournois deja envoyes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top8_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Maj des Top 8 deja publies"
            git push
          fi
